services:
  db:
    image: postgres:16-alpine
    container_name: paperboy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperboy
      POSTGRES_PASSWORD: paperboy
      POSTGRES_DB: paperboy
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - paperboy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperboy -d paperboy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations + seed demo content, then exit. The seed CLI is
  # GUARDED (skips a populated database unless FORCE_SEED=1) — but NOTE:
  # `docker compose start <svc>` starts depends_on services too, i.e. THIS
  # container, with whatever image it was created from. After upgrading past
  # the guard, recreate it once (`docker compose rm -f init && docker compose
  # up -d init`) so no pre-guard zombie container can ever run again.
  init:
    build: { context: ., target: app }
    image: paperboy/app:latest
    command: ["pnpm", "--filter", "@paperboy/db", "seed"]
    environment:
      DATABASE_URL: postgresql://paperboy:paperboy@db:5432/paperboy
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@paperboy.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin!Passw0rd}
      PAPERBOY_PUBLIC_KEY: ${PAPERBOY_PUBLIC_KEY:-pk_live_seed_public_key_value}
      PAPERBOY_PREVIEW_KEY: ${PAPERBOY_PREVIEW_KEY:-prv_seed_preview_key_value}
      # The image sets NODE_ENV=production, so seeding a FRESH database refuses
      # these published demo defaults and omits the editor/author/viewer logins.
      # Set ALLOW_DEMO_CREDENTIALS=true for a throwaway demo, or (better) give the
      # three values above real generated ones — `scripts/setup.sh` does that.
      # A database that already holds data is skipped entirely, so this never
      # blocks an existing deploy.
      ALLOW_DEMO_CREDENTIALS: ${ALLOW_DEMO_CREDENTIALS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: { context: ., target: app }
    image: paperboy/app:latest
    restart: unless-stopped
    command: ["pnpm", "--filter", "@paperboy/api", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://paperboy:paperboy@db:5432/paperboy
      API_PORT: "8091"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090}
      COOKIE_SECURE: ${COOKIE_SECURE:-true} # behind Cloudflare (HTTPS) → Secure __Host- cookie
      ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-false} # set true only for a non-TLS LAN demo
      SESSION_SECRET: ${SESSION_SECRET:-prod-session-secret-please-override-32+chars}
      CSRF_SECRET: ${CSRF_SECRET:-prod-csrf-secret-please-override-32+chars}
      # Encryption key for TOTP secrets at rest. Pin this when rotating SESSION_SECRET
      # so existing 2FA enrolments keep decrypting (else fall back to SESSION_SECRET).
      MFA_SECRET: ${MFA_SECRET:-}
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:-} # empty = relative media URLs (same-origin via each app's proxy; works on any host)
      UPLOADS_DIR: /app/uploads
      # Signs the short-lived preview tokens the admin's iframe uses. MUST be the
      # same value the `web` service verifies with. Unset ⇒ in-editor preview is
      # unavailable (the mint route 503s and says so).
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      # How much of the X-Forwarded-For chain to trust for req.ip (rate-limit keys
      # and audit IPs). "true" trusts ALL hops, so a client that can reach this
      # container directly can spoof its IP and defeat every per-IP limit. Set the
      # real boundary: "1" = exactly one trusted proxy in front.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # AI assistant: Anthropic OR any OpenAI-compatible endpoint. Each key is
      # bound to its own provider; AI_PROVIDER picks one when both are set. A
      # config stored in the CMS (Settings → AI) overrides all of these. No key
      # at all falls back to offline heuristics. AI_MODEL empty = the
      # per-provider default.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      # Stock images: env fallback for the Unsplash key (a CMS-stored key wins).
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      # Login brute-force limit per IP/min — raised by CI e2e runs only.
      LOGIN_RATE_MAX: ${LOGIN_RATE_MAX:-10}
      # Global per-IP request ceiling per minute — raised by CI e2e runs only.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "8091:8091"
    volumes:
      - paperboy-uploads:/app/uploads
    healthcheck:
      # /health/ready (DB-aware), not the static /health — otherwise the
      # container reports healthy while Postgres is unreachable.
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: { context: ., target: app }
    image: paperboy/app:latest
    restart: unless-stopped
    command: ["pnpm", "--filter", "@paperboy/web", "start"]
    environment:
      NODE_ENV: production
      PAPERBOY_API_URL: http://api:8091
      PAPERBOY_PUBLIC_KEY: ${PAPERBOY_PUBLIC_KEY:-pk_live_seed_public_key_value}
      PAPERBOY_PREVIEW_KEY: ${PAPERBOY_PREVIEW_KEY:-prv_seed_preview_key_value}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-dev-preview-secret-change-me}
      # Admin origins allowed to embed the preview iframe (CSP frame-ancestors). Comma-separated.
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8092:8092"
    # Reference frontend (apps/web), reachable at http://localhost:8092.
    # In production you'd deploy your own front end that reads the public
    # Delivery API over HTTP — this one ships so the stack works out of the box.

  admin:
    build:
      context: .
      target: admin
      args:
        # Public origin of the web frontend; the preview iframe loads pages from here.
        VITE_WEB_URL: ${VITE_WEB_URL:-}
        # Deliberately NO preview secret here — see the Dockerfile. The admin gets a
        # short-lived token from the API at runtime instead.
    image: paperboy/admin:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:8090"

  # Paperboy MCP over Streamable HTTP — for remote MCP clients (e.g. harmonix).
  # Opt-in via the "mcp" profile so the default stack stays unchanged. Requires an
  # MCP token (Settings → MCP) which doubles as the Bearer credential clients send.
  #   MCP_TOKEN=mcp_… docker compose --profile mcp up -d --no-deps mcp
  # In production, front it with TLS (e.g. Caddy → paperboy-mcp.<host> → mcp:8093).
  mcp:
    build: { context: ., target: app }
    image: paperboy/app:latest
    restart: unless-stopped
    command: ["pnpm", "--filter", "@paperboy/mcp", "start"]
    profiles: ["mcp"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://paperboy:paperboy@db:5432/paperboy
      MCP_HTTP_PORT: "8093"
      MCP_TOKEN: ${MCP_TOKEN:-} # mint one in Settings → MCP; the server refuses to start in HTTP mode without it
      # Settings stored via the admin (stock-image key, AI key) are encrypted at
      # rest with MFA_SECRET ?? SESSION_SECRET by the api service. The MCP reads
      # the SAME rows — without the same secrets here it silently treats every
      # stored key as unset (found 2026-06-07: Settings → Stock images had a key,
      # MCP still reported "No stock image provider is configured").
      SESSION_SECRET: ${SESSION_SECRET:-prod-session-secret-please-override-32+chars}
      MFA_SECRET: ${MFA_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      # Same as the api service: media URLs in MCP delivery reads (preview_content
      # etc.) absolutize against this; empty = relative (same-origin only).
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:-}
      # Stock images: import_stock_image writes into the SAME uploads volume the
      # api serves at /api/v1/media — without it, imported files would 404.
      UPLOADS_DIR: /app/uploads
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8093:8093"
    volumes:
      - paperboy-uploads:/app/uploads
    networks:
      default: {}
      # Join the Cloudflare Tunnel network so sibling stacks (e.g. harmonix) can
      # reach this MCP by name at http://paperboy-mcp:8093/mcp — no public route.
      cloudflared:
        aliases: [paperboy-mcp]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/health"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  cloudflared:
    name: cloudflared_default
    external: true

volumes:
  paperboy-pgdata:
  paperboy-uploads:
