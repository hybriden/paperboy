name: Feature request
description: Something Paperboy should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where it breaks down today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Optional. How you imagine it working, and which surface (admin, API, MCP, SDK).
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
