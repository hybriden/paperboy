name: Release images

# Publish the two container images this stack is built from, so running Paperboy
# does not require building it from source.
#
# Why this exists: compose built `paperboy/app:latest` and `paperboy/admin:latest`
# LOCALLY, which meant anyone who wanted to run the CMS had to clone this repo and
# wait for a full pnpm monorepo build. It also made "clone the frontend starter and
# get a CMS with it" impossible — there was nothing to pull. With these published,
# the Astro starter's demo compose can bring up the whole thing from one clone.
#
#   ghcr.io/hybriden/paperboy-app     api · init(migrate+seed) · web · mcp
#   ghcr.io/hybriden/paperboy-admin   the admin SPA behind nginx
#
# Both come from the one Dockerfile in this repo (targets `app` and `admin`).
#
# MULTI-ARCH (amd64 + arm64), because for a while these were amd64-only and that
# quietly broke the promise above on every ARM machine:
#
#   no matching manifest for linux/arm64/v8 in the manifest list entries
#
# which is what an Apple Silicon Mac gets — so "clone the starter and get a CMS
# with it" failed for a large share of the people it was written for, and an
# aarch64 server had to build from source instead of pulling.
#
# Each architecture builds on its OWN NATIVE RUNNER and is pushed by digest; a
# second job then stitches the digests into one manifest list per tag. The
# alternative — one runner with QEMU — emulates a full pnpm monorepo build:
# amd64 alone takes ~3 minutes, and emulated arm64 would be several times that
# on every push to main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# The only job here that needs more than read: pushing packages. Nothing else is
# granted, so a compromised dependency in a build cannot touch the repo.
permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: paperboy-app
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - target: app
            image: paperboy-app
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - target: admin
            image: paperboy-admin
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - target: admin
            image: paperboy-admin
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # Labels only here — the TAGS are applied once, by the merge job. A
          # per-arch build that tagged `latest` would leave it pointing at one
          # architecture for as long as the other took to finish.

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed by digest, unnamed by tag: the merge job below is what gives
          # these a name a human types.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The admin SPA inlines VITE_* at build time. VITE_WEB_URL is left EMPTY
          # on purpose: a published image must not carry one deployment's frontend
          # origin. At runtime the admin reads the site's preview URL from the API,
          # which is the setting that actually belongs to a deployment.
          build-args: |
            VITE_WEB_URL=
          # Scoped per ARCH as well as per target: one shared scope would have the
          # two architectures evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      # The digest is the only thing the merge job needs, and an empty file named
      # after it is the smallest way to carry one.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest" || { echo "build produced no digest"; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One manifest list per tag, pointing at both architectures. Until this runs,
  # nothing in the registry is named — so a failed arch cannot publish a
  # half-populated `latest`.
  merge:
    name: publish manifest (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: paperboy-app
          - target: admin
            image: paperboy-admin

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` tracks main so the documented compose files keep working;
          # the sha tag is what you pin a real deployment to, because "latest"
          # is not a version and cannot be rolled back to.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          # Two digests expected (amd64 + arm64). Fewer means an arch silently
          # dropped out, and a one-arch manifest is the bug this job exists to
          # prevent — so fail rather than publish it.
          count=$(ls -1 | wc -l)
          echo "digests: $count"
          test "$count" -eq 2 || { ls -la; echo "expected 2 digests, got $count"; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show what was published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
