name: CI

# Least privilege: CI only reads the repo. Without this block the workflow would
# inherit the repo/org default GITHUB_TOKEN (often write-capable) while running
# untrusted PR code (pnpm install lifecycle scripts, Vite/Next builds, docker build).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub forces JS actions onto Node 24 from 2026-06-16; opt in early so a
# breakage is discovered while it's still a choice (revert this env to roll back).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: typecheck · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperboy
          POSTGRES_PASSWORD: paperboy
          POSTGRES_DB: paperboy_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U paperboy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # Runs WITH coverage so the thresholds in apps/api/vitest.config.ts are
      # enforced here, not just measurable locally. This one suite covers
      # apps/api + packages/db + packages/shared (it drives real HTTP against a
      # real Postgres), so a drop in any of the three fails the build.
      - name: API tests + coverage (Vitest + Postgres)
        run: pnpm --filter @paperboy/api test:coverage
        env:
          # The suite migrates + seeds this database itself (isolated per run).
          TEST_DATABASE_URL: postgresql://paperboy:paperboy@localhost:5433/paperboy_test

      - name: Admin unit tests (Vitest)
        run: pnpm --filter @paperboy/admin test

      # @paperboycms/client and @paperboycms/preview are PUBLISHED to npm and
      # apps/web's specs pin the data-pb-* markers the preview bridge reads —
      # until this step existed all three were gated only by a manual local run.
      - name: Package + web tests (client, preview, web)
        run: pnpm --filter @paperboycms/client --filter @paperboycms/preview --filter @paperboy/web test

      - name: Build admin (Vite)
        run: pnpm --filter @paperboy/admin build

      - name: Build web (Next.js)
        run: pnpm --filter @paperboy/web build

  # The README's literal quickstart, in a clean checkout, with NO extra env.
  # This exists because the documented command provably could not boot: compose's
  # placeholder secrets are refused under NODE_ENV=production, so api crash-looped
  # and web/admin (which wait on service_healthy) never started. Every other job
  # supplies its own secrets, so none of them would ever have caught it.
  quickstart:
    name: quickstart (the documented path, clean checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the documented setup step
        run: ./scripts/setup.sh

      - name: Bring up the documented stack (no extra env)
        run: docker compose up -d --build --wait

      - name: The three documented URLs must answer
        run: |
          curl --retry 20 --retry-delay 3 --retry-all-errors -fsS http://localhost:8091/health/ready
          curl --retry 20 --retry-delay 3 --retry-all-errors -fsS -o /dev/null http://localhost:8090/
          curl --retry 20 --retry-delay 3 --retry-all-errors -fsS -o /dev/null http://localhost:8092/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  e2e:
    name: e2e (Playwright vs composed stack)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @paperboy/admin exec playwright install --with-deps chromium

      - name: Start the full stack (db → migrate+seed → api → web → admin)
        # COOKIE_SECURE=false: the suite logs in over http://localhost:8090
        # (the same reason live-deploy runs need ADMIN_URL=https://…).
        run: docker compose up -d --build --wait
        env:
          COOKIE_SECURE: "false"
          ALLOW_INSECURE_COOKIES: "true"
          # The stack runs NODE_ENV=production, so env.ts now refuses the
          # compose `prod-*-please-override` placeholder secrets (S2-H2). Supply
          # real (non-placeholder) test secrets so the api boots — exactly what
          # any production deploy must now do. MFA_SECRET pins the TOTP key.
          SESSION_SECRET: "ci-e2e-session-secret-not-a-placeholder"
          CSRF_SECRET: "ci-e2e-csrf-secret-not-a-placeholder"
          MFA_SECRET: "ci-e2e-mfa-secret-not-a-placeholder"
          # Signs/verifies the admin's short-lived preview tokens. The api and web
          # services must agree, or the in-editor preview iframe has no way in.
          PREVIEW_SECRET: "ci-e2e-preview-secret-not-a-placeholder"
          # The stack also runs `init` (seed) under NODE_ENV=production, where the
          # seed now refuses the published demo credentials and omits the
          # editor/author/viewer logins. The e2e specs log in AS those fixtures, so
          # this throwaway stack opts in explicitly — which is the whole point of
          # the flag: a real deploy has to make the same choice consciously.
          ALLOW_DEMO_CREDENTIALS: "true"
          # 30 tests + retries from one runner IP — the production limits
          # (10 logins/min, 300 requests/min) would turn a single slow test
          # into a 429 cascade that reads as flaky "element not visible".
          LOGIN_RATE_MAX: "1000"
          RATE_LIMIT_MAX: "10000"

      - name: Wait for admin + api
        run: |
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://localhost:8091/health
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS -o /dev/null http://localhost:8090

      - name: Run e2e suite
        run: pnpm --filter @paperboy/admin test:e2e

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail 200 api admin web

      - name: Upload traces/screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            apps/admin/test-results/
          retention-days: 7
